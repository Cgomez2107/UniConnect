name: Deploy to Fly.io

on:
  push:
    branches: [main]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  setup-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify secrets and environment
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "❌ FLY_API_TOKEN is NOT configured — deploy will fail"
            exit 1
          fi
          echo "✅ FLY_API_TOKEN is configured"
          echo "🚀 Pipeline triggered by push to main branch"
          echo "📦 Repository: ${{ github.repository }}"
          echo "🔖 Ref: ${{ github.ref }}"
