name: Deploy to Fly.io

on:
  push:
    branches: [main]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Build shared-types
        run: pnpm build
        working-directory: packages/shared-types

      - name: Typecheck backend
        run: pnpm typecheck
        working-directory: backend

      - name: Run shared-types contract tests
        run: pnpm test:contracts
        working-directory: packages/shared-types

      - name: Run Sprint 4 contract integration tests
        run: npx vitest run tests/integration/sprint4/ --reporter=verbose
        working-directory: backend

      - name: Run auth integration tests
        run: pnpm --filter @uniconnect/auth test:integration
        working-directory: backend
        continue-on-error: false

      - name: Run study-groups unit tests
        run: pnpm --filter @uniconnect/study-groups test
        working-directory: backend
        continue-on-error: false
