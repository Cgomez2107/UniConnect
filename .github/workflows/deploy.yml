name: Deploy to Fly.io

on:
  push:
    branches: [main, integration/pre-deploy]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"

jobs:
  # ── Job 1: Test ──────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types
        run: pnpm build
        working-directory: packages/shared-types

      - name: Install backend workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Typecheck backend
        run: pnpm typecheck
        working-directory: backend

      - name: Run Turbo workspace tests
        run: pnpm test
        working-directory: backend

      - name: Run shared-types contract tests
        run: pnpm test:contracts
        working-directory: packages/shared-types

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Typecheck web
        run: pnpm type-check
        working-directory: web

      - name: Build web (Vite)
        run: pnpm build
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  # ── Job 2: Deploy Backend ────────────────────────────────────────────
  deploy-backend:
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/pre-deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Capture current stable image
        id: stable
        run: |
          APP=$(grep '^app =' fly.toml | head -1 | sed 's/.*= *//' | tr -d "'" | tr -d '"')
          STABLE_IMAGE=$(flyctl releases --app "$APP" --json 2>/dev/null | jq -r '.[0].imageRef // empty')
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "image=$STABLE_IMAGE" >> $GITHUB_OUTPUT
          echo "App: $APP  |  Stable image: ${STABLE_IMAGE:-none (first deploy)}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy backend to Fly.io
        id: deploy
        run: flyctl deploy --remote-only --build-arg COMMIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Validate backend deployment
        id: validate
        run: |
          HEALTH_URL="https://uniconnect-backend-grupo-2.fly.dev/health"
          EXPECTED_SHA="${{ github.sha }}"
          MAX_RETRIES=18
          RETRY_DELAY=10
          DEPLOYED_SHA=""
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL")
            if [ "$HTTP_CODE" = "200" ]; then
              DEPLOYED_SHA=$(jq -r '.commit // empty' /tmp/health.json)
              echo "[$i/$MAX_RETRIES] Health OK — commit: $DEPLOYED_SHA"
              if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
                echo "Deploy validated: commit $DEPLOYED_SHA matches GITHUB_SHA"
                break
              else
                echo "Commit mismatch (expected $EXPECTED_SHA), waiting for rollout..."
              fi
            else
              echo "[$i/$MAX_RETRIES] HTTP $HTTP_CODE, retrying in ${RETRY_DELAY}s..."
            fi
            sleep $RETRY_DELAY
          done
          if [ "$DEPLOYED_SHA" != "$EXPECTED_SHA" ]; then
            echo "Deployment validation failed after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Rollback to previous stable image
        id: rollback
        if: failure() && steps.stable.outputs.image != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP="${{ steps.stable.outputs.app }}"
          IMAGE="${{ steps.stable.outputs.image }}"
          echo "Rolling back $APP to image $IMAGE"
          flyctl deploy --app "$APP" --image "$IMAGE" --strategy immediate

      - name: Notify deployment status
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          COMMIT_MSG=$(git log -1 --pretty=%B "${{ github.sha }}" | head -c 500)
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')

          ROLLBACK_OUTCOME="${{ steps.rollback.outcome }}"
          VALIDATE_OUTCOME="${{ steps.validate.outcome }}"

          if [ "$ROLLBACK_OUTCOME" = "success" ]; then
            STATUS_EMOJI="⚠️"
            STATUS_TEXT="ROLLBACK EXECUTED — failed deploy reverted to previous stable image"
            COLOR=16776960
          elif [ "$VALIDATE_OUTCOME" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="DEPLOY SUCCESS — all health checks passed"
            COLOR=3066993
          else
            STATUS_EMOJI="🔴"
            STATUS_TEXT="DEPLOY FAILED — check the workflow log for details"
            COLOR=15158332
          fi

          jq -n \
            --arg title "${STATUS_EMOJI} Backend · ${BRANCH}" \
            --arg desc "$STATUS_TEXT" \
            --arg sha "$SHORT_SHA" \
            --arg msg "$COMMIT_MSG" \
            --arg url "$WORKFLOW_URL" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                fields: [
                  { name: "Commit", value: "`\($sha)`", inline: true },
                  { name: "Branch", value: $ENV.BRANCH, inline: true }
                ],
                description: "**\($desc)**\n\n\($msg)\n\n[View Workflow Log](\($url))",
                timestamp: now
              }]
            }' \
            --arg BRANCH "$BRANCH" \
            > /tmp/discord-payload.json

          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @/tmp/discord-payload.json
          echo "Notification sent"

  # ── Job 3: Deploy Web ────────────────────────────────────────────────
  deploy-web:
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/pre-deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Capture current stable image
        id: stable
        run: |
          APP=$(grep '^app =' fly-web.toml | head -1 | sed 's/.*= *//' | tr -d "'" | tr -d '"')
          STABLE_IMAGE=$(flyctl releases --app "$APP" --json 2>/dev/null | jq -r '.[0].imageRef // empty')
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "image=$STABLE_IMAGE" >> $GITHUB_OUTPUT
          echo "App: $APP  |  Stable image: ${STABLE_IMAGE:-none (first deploy)}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy web to Fly.io
        id: deploy
        run: flyctl deploy --remote-only --config fly-web.toml --build-arg VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Validate web deployment
        id: validate
        run: |
          WEB_URL="https://uniconnect-dashboard-web.fly.dev"
          MAX_RETRIES=12
          RETRY_DELAY=10
          SUCCESS=false
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_URL")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "[$i/$MAX_RETRIES] Web responds HTTP $HTTP_CODE"
              SUCCESS=true
              break
            fi
            echo "[$i/$MAX_RETRIES] HTTP $HTTP_CODE, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
          if [ "$SUCCESS" != "true" ]; then
            echo "Web deployment validation failed after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Rollback to previous stable image
        id: rollback
        if: failure() && steps.stable.outputs.image != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP="${{ steps.stable.outputs.app }}"
          IMAGE="${{ steps.stable.outputs.image }}"
          echo "Rolling back $APP to image $IMAGE"
          flyctl deploy --app "$APP" --image "$IMAGE" --strategy immediate

      - name: Notify deployment status
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          COMMIT_MSG=$(git log -1 --pretty=%B "${{ github.sha }}" | head -c 500)
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')

          ROLLBACK_OUTCOME="${{ steps.rollback.outcome }}"
          VALIDATE_OUTCOME="${{ steps.validate.outcome }}"

          if [ "$ROLLBACK_OUTCOME" = "success" ]; then
            STATUS_EMOJI="⚠️"
            STATUS_TEXT="ROLLBACK EXECUTED — failed deploy reverted to previous stable image"
            COLOR=16776960
          elif [ "$VALIDATE_OUTCOME" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="DEPLOY SUCCESS — Vite build served behind Nginx"
            COLOR=3066993
          else
            STATUS_EMOJI="🔴"
            STATUS_TEXT="DEPLOY FAILED — check the workflow log for details"
            COLOR=15158332
          fi

          jq -n \
            --arg title "${STATUS_EMOJI} Dashboard Web · ${BRANCH}" \
            --arg desc "$STATUS_TEXT" \
            --arg sha "$SHORT_SHA" \
            --arg msg "$COMMIT_MSG" \
            --arg url "$WORKFLOW_URL" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                fields: [
                  { name: "Commit", value: "`\($sha)`", inline: true },
                  { name: "Branch", value: $ENV.BRANCH, inline: true }
                ],
                description: "**\($desc)**\n\n\($msg)\n\n[View Workflow Log](\($url))",
                timestamp: now
              }]
            }' \
            --arg BRANCH "$BRANCH" \
            > /tmp/discord-payload.json

          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @/tmp/discord-payload.json
          echo "Notification sent"
