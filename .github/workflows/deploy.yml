name: Deploy to Fly.io

on:
  push:
    branches: [main, integration/pre-deploy]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"

jobs:
  # ── Job 1: Test ──────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Build shared-types (pre-requisite for backend)
        run: pnpm build
        working-directory: packages/shared-types

      - name: Typecheck backend
        run: pnpm typecheck
        working-directory: backend

      - name: Run Turbo workspace tests
        run: pnpm test
        working-directory: backend

      - name: Run backend unit & feature tests (node:test)
        run: |
          node --import tsx --test tests/unit/decorators/*.spec.ts tests/feat/*.spec.ts
          node --import tsx --test services/study-groups/test/*.spec.ts
        working-directory: backend

      - name: Run integration tests (vitest)
        run: |
          npx vitest run tests/integration/sprint4/ --reporter=verbose
          npx vitest run tests/unit/notification.service.spec.ts --reporter=verbose
          npx vitest run tests/integration/profiles-catalog/ --reporter=verbose
        working-directory: backend

      - name: Run shared-types contract tests
        run: pnpm test:contracts
        working-directory: packages/shared-types

  # ── Job 2: Deploy ────────────────────────────────────────────────────
  deploy:
    needs: [test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: gateway
            cwd: backend
            config: fly.toml
          - name: auth
            cwd: backend
            config: services/auth/fly.toml
          - name: study-groups
            cwd: backend
            config: services/study-groups/fly.toml
          - name: resources
            cwd: backend
            config: services/resources/fly.toml
          - name: messaging
            cwd: backend
            config: services/messaging/fly.toml
          - name: profiles-catalog
            cwd: backend
            config: services/profiles-catalog/fly.toml
          - name: events
            cwd: backend
            config: services/events/fly.toml
          - name: frontend
            cwd: frontend
            config: fly.toml
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy ${{ matrix.service.name }} to Fly.io
        run: flyctl deploy --remote-only -c ${{ matrix.service.config }}
        working-directory: ${{ matrix.service.cwd }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Validate ${{ matrix.service.name }} deployment
        run: |
          echo "Validating deployment of ${{ matrix.service.name }}..."
          APP_NAME=$(grep '^app =' "${{ matrix.service.config }}" | head -1 | cut -d'"' -f2)
          echo "App: $APP_NAME"
          STATUS=$(flyctl status --app "$APP_NAME" --json 2>/dev/null | grep -o '"status":"[^"]*"' | head -1 || echo '"status":"unknown"')
          echo "State of $APP_NAME: $STATUS"
          if echo "$STATUS" | grep -qi "deployed"; then
            echo "${{ matrix.service.name }} deployed correctly"
          else
            echo "Could not verify status of ${{ matrix.service.name }}"
            echo "Check manually: flyctl status --app $APP_NAME"
          fi
        working-directory: ${{ steps.pnpm-cache.outputs.STORE_PATH != '' && matrix.service.cwd || matrix.service.cwd }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}