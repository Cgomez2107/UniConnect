name: Deploy to Fly.io

on:
  push:
    branches: [main, integration/pre-deploy]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"

jobs:
  # ── Job 1: Test ──────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types
        run: pnpm build
        working-directory: packages/shared-types

      - name: Install backend workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Typecheck backend
        run: pnpm typecheck
        working-directory: backend

      - name: Run Turbo workspace tests
        run: pnpm test
        working-directory: backend

      - name: Run shared-types contract tests
        run: pnpm test:contracts
        working-directory: packages/shared-types

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Typecheck web
        run: pnpm type-check
        working-directory: web

      - name: Build web (Vite)
        run: pnpm build
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  # ── Job 2: Deploy Backend ────────────────────────────────────────────
  deploy-backend:
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/pre-deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy backend to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Validate backend deployment
        run: |
          APP_NAME=$(grep '^app =' fly.toml | head -1 | cut -d"'" -f2)
          echo "App: $APP_NAME"
          STATUS=$(flyctl status --app "$APP_NAME" --json 2>/dev/null | grep -o '"status":"[^"]*"' | head -1 || echo '"status":"unknown"')
          echo "State of $APP_NAME: $STATUS"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ── Job 3: Deploy Web ────────────────────────────────────────────────
  deploy-web:
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/pre-deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy web to Fly.io
        run: flyctl deploy --remote-only --config fly-web.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Validate web deployment
        run: |
          APP_NAME=$(grep '^app =' fly-web.toml | head -1 | cut -d'"' -f2)
          echo "App: $APP_NAME"
          STATUS=$(flyctl status --app "$APP_NAME" --json 2>/dev/null | grep -o '"status":"[^"]*"' | head -1 || echo '"status":"unknown"')
          echo "State of $APP_NAME: $STATUS"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
