  # ─── Job: Pattern & Global Coverage ───
  test-coverage:
    needs: [contracts]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Install backend workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types
        run: pnpm build
        working-directory: packages/shared-types

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage HTML artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/
          include-hidden-files: true

  # ─── Job: Post Coverage Comment on PR ───
  coverage-comment:
    needs: [test-coverage]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage
        continue-on-error: true

      - name: Check if report exists
        id: check
        run: |
          if [ -f "coverage/coverage-summary.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No coverage report found — skipping comment"
          fi

      - name: Build coverage comment
        id: build
        if: steps.check.outputs.exists == 'true'
        run: |
          FILE="coverage/coverage-summary.json"

          LINES=$(jq -r '.total.lines.pct' "$FILE")
          BRANCHES=$(jq -r '.total.branches.pct' "$FILE")
          FUNCTIONS=$(jq -r '.total.functions.pct' "$FILE")
          STATEMENTS=$(jq -r '.total.statements.pct' "$FILE")

          PATTERNS_PREFIXES=("services/messaging/src/domain/decorators" "shared/patterns/decorator" "services/events/src/domain/events" "shared/patterns/observer")
          TOTAL=0
          COVERED=0
          for prefix in "${PATTERNS_PREFIXES[@]}"; do
            while IFS=$'\t' read -r t c; do
              TOTAL=$((TOTAL + t))
              COVERED=$((COVERED + c))
            done < <(jq -r --arg prefix "$prefix" '
              to_entries[]
              | select(.key | gsub("\\\\"; "/") | contains($prefix))
              | "\(.value.lines.total)\t\(.value.lines.covered)"
            ' "$FILE")
          done

          if [ "$TOTAL" -gt 0 ]; then
            PATTERNS_PCT=$(echo "scale=2; $COVERED * 100 / $TOTAL" | bc)
          else
            PATTERNS_PCT="N/A"
          fi

          GLOBAL_PASS=true
          PATTERNS_PASS=true
          for metric in "$LINES" "$BRANCHES" "$FUNCTIONS" "$STATEMENTS"; do
            if (( $(echo "$metric < 70" | bc -l) )); then
              GLOBAL_PASS=false
              break
            fi
          done
          if [ "$PATTERNS_PCT" != "N/A" ] && (( $(echo "$PATTERNS_PCT < 85" | bc -l) )); then
            PATTERNS_PASS=false
          fi

          if [ "$GLOBAL_PASS" = true ]; then GLOBAL_ICON="✅"; else GLOBAL_ICON="❌"; fi
          if [ "$PATTERNS_PASS" = true ]; then PATTERNS_ICON="✅"; else PATTERNS_ICON="❌"; fi

          {
            echo "## 📊 Coverage Report"
            echo ""
            echo "### Global Coverage ${GLOBAL_ICON} (threshold 70%)"
            echo ""
            echo "| Metric | Coverage |"
            echo "|--------|----------|"
            echo "| Lines | ${LINES}% |"
            echo "| Branches | ${BRANCHES}% |"
            echo "| Functions | ${FUNCTIONS}% |"
            echo "| Statements | ${STATEMENTS}% |"
            echo ""
            echo "### Pattern Coverage ${PATTERNS_ICON} (threshold 85%)"
            echo ""
            echo "| Module | Coverage |"
            echo "|--------|----------|"
            echo "| Decorator + Observer | ${PATTERNS_PCT}% |"
            echo ""
            if [ "$GLOBAL_PASS" = false ] || [ "$PATTERNS_PASS" = false ]; then
              echo "> ⚠️ **Quality gate will fail** — one or more coverage thresholds not met."
            else
              echo "> ✅ **All coverage thresholds met.**"
            fi
          } > /tmp/coverage-comment.md

          cat /tmp/coverage-comment.md

      - name: Post comment on PR
        if: steps.build.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: /tmp/coverage-comment.md

  # ─── Quality Gate Final ───
  quality-gate:
    needs: [contracts, backend, frontend, web, sprint4-contracts, test-coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate quality gate
        run: |
          echo "Quality Gate Evaluation:"
          FAILED=""
          check() {
            local j="$1" r="$2"
            if [ "$r" = "success" ]; then
              echo "  PASS $j"
            else
              echo "  FAIL $j ($r)"
              FAILED="$FAILED $j"
            fi
          }
          check "contracts"          "${{ needs.contracts.result }}"
          check "backend"            "${{ needs.backend.result }}"
          check "frontend"           "${{ needs.frontend.result }}"
          check "web"                "${{ needs.web.result }}"
          check "sprint4-contracts"  "${{ needs.sprint4-contracts.result }}"
          check "test-coverage"      "${{ needs.test-coverage.result }}"
          echo ""
          if [ -n "$FAILED" ]; then
            echo "QUALITY GATE FAILED - Failed jobs:$FAILED"
            exit 1
          fi
          echo "QUALITY GATE PASSED"