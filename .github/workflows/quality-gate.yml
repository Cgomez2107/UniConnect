name: quality-gate

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [main, integration/pre-deploy]
    paths:
      - "packages/**"
      - "backend/**"
      - "web/**"
      - "frontend/**"
      - ".github/workflows/quality-gate.yml"
  push:
    branches: [main, integration/pre-deploy, feature/**, feat/**, fix/**]
    paths:
      - "packages/**"
      - "backend/**"
      - "web/**"
      - "frontend/**"
      - ".github/workflows/quality-gate.yml"

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"
  COVERAGE_THRESHOLD: 80

jobs:
  # ─── Job 1: Contract Validation — FAIL FAST ───
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared-types
        run: pnpm typecheck
        working-directory: packages/shared-types

      - name: Build shared-types
        run: pnpm build
        working-directory: packages/shared-types

      - name: Run contract tests
        run: pnpm test:contracts
        working-directory: packages/shared-types

  # ─── Job 2: Backend Quality (typecheck + integration + coverage) ───
  backend:
    needs: [contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Build shared-types (pre-requisite)
        run: pnpm build
        working-directory: packages/shared-types

      - name: Typecheck backend (all services)
        run: pnpm typecheck
        working-directory: backend

      - name: Lint backend (all services)
        run: pnpm lint
        working-directory: backend

      - name: Run auth integration tests with coverage
        run: pnpm --filter @uniconnect/auth test:integration
        working-directory: backend

  # ─── Job 3: Frontend Quality (typecheck) ───
  frontend:
    needs: [contracts]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Generate shared-types artifacts for frontend
        run: pnpm prebuild
        working-directory: frontend/shared-types

      - name: Typecheck frontend (mobile)
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint frontend (mobile)
        run: pnpm lint
        working-directory: frontend

  # ─── Job 4: Web Quality (typecheck + build) ───
  web:
    needs: [contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types (contracts updated)
        run: pnpm build
        working-directory: packages/shared-types

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Typecheck web
        run: pnpm type-check
        working-directory: web

      - name: Lint web
        run: pnpm lint
        working-directory: web

      - name: Build web (Vite)
        run: pnpm build
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  # ─── Job 5: Sprint 4 Contract Integration Tests ───
  sprint4-contracts:
    needs: [contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Build shared-types
        run: pnpm build
        working-directory: packages/shared-types

      - name: Run Sprint 4 contract integration tests
        run: npx vitest run tests/integration/sprint4/ --reporter=verbose --coverage
        working-directory: backend

      - name: Check coverage threshold
        shell: bash
        working-directory: backend
        run: |
          COVERAGE_FILE="coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            COVERAGE=$(jq '.total.lines.pct' "$COVERAGE_FILE")
            echo "Sprint 4 Coverage: $COVERAGE%"
            if (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
              echo "❌ Coverage $COVERAGE% below threshold ${{ env.COVERAGE_THRESHOLD }}%"
              exit 1
            fi
            echo "✅ Coverage $COVERAGE% meets threshold ${{ env.COVERAGE_THRESHOLD }}%"
          else
            echo "❌ No coverage report found at $COVERAGE_FILE"
            exit 1
          fi

      - name: Publish Sprint 4 coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint4-contract-coverage
          path: backend/coverage/

