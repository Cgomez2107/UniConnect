# ============================================================================
# docker-compose.yml - Stack local: backend + frontend + db
# Ubicacion: repo root
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: uniconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-uniconnect_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password_dev}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - uniconnect-network

  backend-setup:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: uniconnect-backend-setup
    working_dir: /app
    # Run pnpm in workspace mode, frozen lockfile and pipe a 'yes' to accept prompts
    # This avoids interactive prompts on pnpm versions that don't support --no-interactive or -y
    command: sh -c "yes | pnpm -w install --frozen-lockfile"
    environment:
      # CI=true helps make package tools non-interactive in CI/containers
      CI: "true"
      PNPM_STORE_DIR: /pnpm-store
    volumes:
      - ./backend:/app
      - backend-pnpm-store:/pnpm-store
      - backend-node-modules:/app/node_modules
    networks:
      - uniconnect-network

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: uniconnect-gateway
    working_dir: /app
    command: sh -c "pnpm --filter @uniconnect/gateway dev"
    environment:
      NODE_ENV: development
      PORT: 3000
      PNPM_STORE_DIR: /pnpm-store
      STUDY_GROUPS_BASE_URL: http://study-groups:3101
      RESOURCES_BASE_URL: http://resources:3103
      MESSAGING_BASE_URL: http://messaging:3104
      PROFILES_CATALOG_BASE_URL: http://profiles-catalog:3105
      EVENTS_BASE_URL: http://events:3106
      AUTH_BASE_URL: http://auth:3102
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_secret_access}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend-pnpm-store:/pnpm-store
      - backend-node-modules:/app/node_modules
    depends_on:
      backend-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      auth:
        condition: service_started
      study-groups:
        condition: service_started
      resources:
        condition: service_started
      messaging:
        condition: service_started
      profiles-catalog:
        condition: service_started
      events:
        condition: service_started
    networks:
      - uniconnect-network

  auth:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: uniconnect-auth
    working_dir: /app
    command: sh -c "pnpm --filter @uniconnect/auth dev"
    environment:
      NODE_ENV: development
      PORT: 3102
      PNPM_STORE_DIR: /pnpm-store
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-uniconnect_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_password_dev}
      DB_SSL: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_secret_access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_secret_refresh}
    ports:
      - "3102:3102"
    volumes:
      - ./backend:/app
      - backend-pnpm-store:/pnpm-store
      - backend-node-modules:/app/node_modules
    depends_on:
      backend-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - uniconnect-network

  study-groups:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: uniconnect-study-groups
    working_dir: /app
    command: sh -c "pnpm --filter @uniconnect/study-groups dev"
    environment:
      NODE_ENV: development
      PORT: 3101
      PNPM_STORE_DIR: /pnpm-store
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-uniconnect_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_password_dev}
      DB_SSL: "false"
    ports:
      - "3101:3101"
    volumes:
      - ./backend:/app
      - backend-pnpm-store:/pnpm-store
      - backend-node-modules:/app/node_modules
    depends_on:
      backend-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - uniconnect-network

  resources:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: uniconnect-resources
    working_dir: /app
    command: sh -c "pnpm --filter @uniconnect/resources dev"
    environment:
      NODE_ENV: development
      PORT: 3103
      PNPM_STORE_DIR: /pnpm-store
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-uniconnect_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_password_dev}
      DB_SSL: "false"
    ports:
      - "3103:3103"
    volumes:
      - ./backend:/app
      - backend-pnpm-store:/pnpm-store
      - backend-node-modules:/app/node_modules
    depends_on:
      backend-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - uniconnect-network

  messaging:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: uniconnect-messaging
    working_dir: /app
    command: sh -c "pnpm --filter @uniconnect/messaging dev"
    environment:
      NODE_ENV: development
      PORT: 3104
      PNPM_STORE_DIR: /pnpm-store
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-uniconnect_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_password_dev}
      DB_SSL: "false"
    ports:
      - "3104:3104"
    volumes:
      - ./backend:/app
      - backend-pnpm-store:/pnpm-store
      - backend-node-modules:/app/node_modules
    depends_on:
      backend-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - uniconnect-network

  profiles-catalog:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: uniconnect-profiles-catalog
    working_dir: /app
    command: sh -c "pnpm --filter @uniconnect/profiles-catalog dev"
    environment:
      NODE_ENV: development
      PORT: 3105
      PNPM_STORE_DIR: /pnpm-store
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-uniconnect_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_password_dev}
      DB_SSL: "false"
    ports:
      - "3105:3105"
    volumes:
      - ./backend:/app
      - backend-pnpm-store:/pnpm-store
      - backend-node-modules:/app/node_modules
    depends_on:
      backend-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - uniconnect-network

  events:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: uniconnect-events
    working_dir: /app
    command: sh -c "pnpm --filter @uniconnect/events dev"
    environment:
      NODE_ENV: development
      PORT: 3106
      PNPM_STORE_DIR: /pnpm-store
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-uniconnect_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_password_dev}
      DB_SSL: "false"
    ports:
      - "3106:3106"
    volumes:
      - ./backend:/app
      - backend-pnpm-store:/pnpm-store
      - backend-node-modules:/app/node_modules
    depends_on:
      backend-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - uniconnect-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: uniconnect-web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://gateway:3000/api/v1}
    ports:
      - "8080:80"
    depends_on:
      - gateway
    networks:
      - uniconnect-network
  frontend:
    image: node:20-alpine
    container_name: uniconnect-frontend
    working_dir: /app
    environment:
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://gateway:3000/api/v1}
      EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL:-https://your-supabase-project.supabase.co}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_ANON_KEY:-your_supabase_anon_key_here}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB: ${EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB:-your_google_client_id_web.apps.googleusercontent.com}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID_IOS: ${EXPO_PUBLIC_GOOGLE_CLIENT_ID_IOS:-your_google_client_id_ios.apps.googleusercontent.com}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID: ${EXPO_PUBLIC_GOOGLE_CLIENT_ID_ANDROID:-your_google_client_id_android.apps.googleusercontent.com}
    volumes:
      - ./frontend:/app
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    command: sh -c "npm install && npm run start -- --host lan"
    depends_on:
      - gateway
    networks:
      - uniconnect-network

volumes:
  db-data:
    driver: local
  backend-pnpm-store:
    driver: local
  backend-node-modules:
    driver: local

networks:
  uniconnect-network:
    driver: bridge
